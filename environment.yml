name: ride-demand
channels:
  - conda-forge
dependencies:
  - python=3.12

  # Data processing
  - duckdb
  - python-duckdb
  - pyarrow
  - pandas
  - numpy
  - geopandas
  - shapely
  - pyproj
  - holidays

  # Modeling and statistics
  - scikit-learn
  - scipy
  - statsmodels
  - xgboost
  - lightgbm
  - catboost

  # Notebooks and plotting
  - jupyterlab
  - ipykernel
  - matplotlib
  - seaborn
  - plotly
  - markdown
  - psutil

  # Data access
  - requests
  - python-dotenv
  - huggingface_hub

  # Dev tooling
  - pytest
  - ruff
  - mypy
