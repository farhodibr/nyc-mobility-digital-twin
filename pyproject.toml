[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ride_demand"
version = "0.1.0"
description = "NYC Ride Demand Intelligence Platform"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "numpy==2.5.1",
    "pandas==2.3.3",
    "xgboost==3.3.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ride_demand"]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
